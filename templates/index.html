<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太陽光発電分析</title>

  <style>
    body{
      font-family: sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      font-size: 18px;
      background: #f5f5f5;
    }

    p{
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }

    form{
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    button{
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    pre{
      white-space: pre-wrap;
      background: white;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.8;
      font-size: 18px;
    }
  </style>

</head>
<body>

<p>太陽光発電量分析</p>

<form action="/upload" method="post" enctype="multipart/form-data">
  <input type="file" name="image" required>
  <button type="submit">送信</button>
</form>

<hr>

{% if result %}
<h3>解析結果</h3>
<pre>{{ result }}</pre>
{% endif %}

</body>
</html>
